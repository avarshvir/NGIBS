name: Build and Release NGIBS Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name NGIBS `
            --icon assets/ngibs-icon.ico `
            main.py

      - name: Prepare release folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release\NGIBS | Out-Null
          Copy-Item "dist\NGIBS.exe" "release\NGIBS\NGIBS.exe"
          Copy-Item "install_and_run.bat" "release\NGIBS\install_and_run.bat"
          Copy-Item "README.md" "release\NGIBS\README.txt"
          Compress-Archive -Path "release\NGIBS\*" -DestinationPath "release\NGIBS-Windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NGIBS-Windows
          path: release/NGIBS-Windows.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/NGIBS-Windows.zip